<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime ERP - Modern Business ERP Interface</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(15, 23, 42, 0.03)',
            'xs': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Lucide Icons UMD -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom scrollbar for modern SaaS feel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-900 bg-slate-50 selection:bg-slate-900 selection:text-white">
  <div id="root" class="h-full"></div>

  <!-- Application Modules -->
  <script src="./js/data/mockData.js"></script>
  <script src="./js/context/ERPContext.js"></script>
  <script src="./js/components/UI.js"></script>
  <script src="./js/components/Shell.js"></script>
  <script src="./js/views/Dashboard.js"></script>
  <script src="./js/views/Purchases.js"></script>
  <script src="./js/views/Inventory.js"></script>
  <script src="./js/views/Sales.js"></script>
  <script src="./js/views/Masters.js"></script>
  <script src="./js/views/Reports.js"></script>
  <script src="./js/views/Settings.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
